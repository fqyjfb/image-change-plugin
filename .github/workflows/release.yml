name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/index.js
          body: |
            ## 更新内容
            
            - 支持本地图片、网络图片、SVG代码转换
            - 支持转换为PNG或ICO格式
            - PNG格式保持原尺寸，不进行缩放
            - ICO格式支持多尺寸输出（16/32/48/64/128/256px）
            - 支持自定义保存路径
            - 支持拖拽上传
            - 自动适配深色/浅色主题